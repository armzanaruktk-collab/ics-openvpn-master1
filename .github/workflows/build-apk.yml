name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OpenVPN Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch native OpenVPN dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p main/src/main/cpp
          clone_if_missing() {
            local url="$1"
            local path="$2"
            if [ ! -f "$path/.git" ] && [ ! -d "$path/.git" ]; then
              rm -rf "$path"
              git clone --depth 1 --recurse-submodules "$url" "$path"
            fi
          }
          clone_if_missing https://github.com/schwabe/openvpn.git main/src/main/cpp/openvpn
          clone_if_missing https://github.com/schwabe/platform_external_openssl.git main/src/main/cpp/openssl
          clone_if_missing https://github.com/ARMmbed/mbedtls.git main/src/main/cpp/mbedtls
          clone_if_missing https://github.com/schwabe/openvpn3.git main/src/main/cpp/openvpn3
          clone_if_missing https://github.com/chriskohlhoff/asio.git main/src/main/cpp/asio
          clone_if_missing https://github.com/lz4/lz4.git main/src/main/cpp/lz4
          clone_if_missing https://github.com/fmtlib/fmt.git main/src/main/cpp/fmt

          # This project expects the SWIG interface under client/, while upstream
          # currently keeps the interface in javacli/. Copy it into the expected path.
          if [ ! -f main/src/main/cpp/openvpn3/client/ovpncli.i ] && [ -f main/src/main/cpp/openvpn3/javacli/ovpncli.i ]; then
            cp main/src/main/cpp/openvpn3/javacli/ovpncli.i main/src/main/cpp/openvpn3/client/ovpncli.i
          fi

          test -f main/src/main/cpp/openvpn3/client/ovpncli.i || {
            echo "Missing SWIG interface. Available candidates:"
            find main/src/main/cpp/openvpn3 -name 'ovpncli.i' -print
            exit 1
          }
          test -f main/src/main/cpp/openssl/openssl.cmake

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory not found: $SDK_ROOT"
            find /usr/local/lib/android /opt -maxdepth 5 -type d -name sdk 2>/dev/null || true
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER_PATH=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER_PATH" --licenses >/dev/null || true
          "$SDKMANAGER_PATH" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.14904198" "cmake;3.22.1"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y swig build-essential pkg-config

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APKs
        run: |
          ./gradlew --no-daemon --stacktrace :main:assembleUiOvpn23Debug :main:assembleUiOvpn2Debug

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-android-debug-apks
          path: main/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
